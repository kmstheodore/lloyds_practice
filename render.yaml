services:
  - type: web
    name: lloyds-practice
    runtime: ruby
    plan: free
    buildCommand: "./bin/rails db:prepare && ./bin/rails assets:precompile"
    startCommand: "./bin/rails server -b 0.0.0.0 -p $PORT"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
